name: Release On Version Tag

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-on-version-tag-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Verify tag and manifest version
        run: |
          version="$(node -p "JSON.parse(require('fs').readFileSync('komari-theme.json')).version")"
          test "${GITHUB_REF_NAME}" = "v${version}"
      - name: Run public-distribution security and license gate
        run: ./scripts/security-gate.sh --public
      - name: Build twice and verify reproducibility
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          short_sha="$(git rev-parse --short HEAD)"
          export VITE_THEME_ASSET_BASE="/themes/Starfield/dist-${short_sha}/"
          bun run build
          mapfile -t archives < <(find . -maxdepth 1 -type f -name 'komari-theme-Starfield-build-*.zip' -printf '%f\n' | sort)
          test "${#archives[@]}" -eq 1
          archive="${archives[0]}"
          cp "$archive" "${archive}.first"
          rm -rf dist "$archive"
          bun run build
          cmp "${archive}.first" "$archive"
          rm "${archive}.first"
          sha256sum "$archive" > "${archive}.sha256"
          sha256sum "$archive" Starfield.spdx.json > SHA256SUMS
          ARCHIVE="$archive" node <<'NODE'
          const { execFileSync } = require('node:child_process')
          const { createHash } = require('node:crypto')
          const { readFileSync, writeFileSync } = require('node:fs')
          const archive = process.env.ARCHIVE
          writeFileSync('release-provenance.json', `${JSON.stringify({
            archive,
            sha256: createHash('sha256').update(readFileSync(archive)).digest('hex'),
            release_tag: process.env.GITHUB_REF_NAME,
            source_commit: process.env.GITHUB_SHA,
            source_date_epoch: Number(execFileSync('git', ['show', '-s', '--format=%ct', 'HEAD'], { encoding: 'utf8' }).trim()),
            asset_base: process.env.VITE_THEME_ASSET_BASE,
            builder: { bun: '1.3.14', node: process.version },
            distribution: 'reviewed clean public distribution',
          }, null, 2)}\n`)
          NODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: |
            komari-theme-Starfield-build*.zip
            komari-theme-Starfield-build*.zip.sha256
            SHA256SUMS
            release-provenance.json
            Starfield.spdx.json
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            komari-theme-Starfield-build*.zip
            komari-theme-Starfield-build*.zip.sha256
            SHA256SUMS
            release-provenance.json
            Starfield.spdx.json
